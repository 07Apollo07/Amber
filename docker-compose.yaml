# Amber on a single Google Cloud VM (Compute Engine) or locally: UI + API + Cloud SQL proxy.
#
#   cp deploy.env.example deploy.env   # fill it in; never commit deploy.env
#   docker compose --env-file deploy.env up -d --build
#
# Only the UI is published. It proxies /api/* to the API over the private network, so the browser
# sees one origin (needed for the __Host- cookies). Put HTTPS in front of port 8080 (for example a
# Google load balancer or Caddy); the app's Secure cookies won't work over plain http.
# This file is not for Cloud Run: it runs the services separately (see DEPLOY.MD).
services:
  ui:
    build:
      context: ./ui
      args:
        AMBER_API_ORIGIN: http://api:8000
    environment:
      AMBER_API_ORIGIN: http://api:8000
    ports:
      - "8080:3000"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    env_file: deploy.env
    environment:
      AMBER_ENV: prod
      AMBER_PUBLIC_BASE_URL: ${AMBER_PUBLIC_BASE_URL:?set the public https URL}
      AMBER_DATABASE_DSN: ${AMBER_DATABASE_DSN:?set the DSN, host cloud-sql-proxy}
      AMBER_TRUSTED_PROXIES: ${AMBER_TRUSTED_PROXIES:-172.16.0.0/12}
    expose:
      - "8000"
    depends_on:
      - cloud-sql-proxy
    restart: unless-stopped

  # Connects the API to the existing Cloud SQL instance using the VM's service account (no key file).
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
    command: ["--address=0.0.0.0", "--port=5432", "${CLOUD_SQL_CONNECTION_NAME:?project:region:instance}"]
    expose:
      - "5432"
    restart: unless-stopped
