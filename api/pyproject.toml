[project]
name = "amber-api"
version = "0.1.0"
description = "Amber API: FastAPI backend for the Amber enterprise RAG app"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "firebase-admin>=7.7.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.59.1",
    "google-cloud-kms>=3.18.0",
    "google-cloud-storage>=3.16.0",
    "google-genai>=1.0.0",
    "httpx>=0.28.1",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "markitdown[pptx]>=0.1.8",
    "openpyxl>=3.1.5",
    "psycopg[binary,pool]>=3.1.0",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "pypdf>=5.0.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.18",
    "requests>=2.34.2",
    "tiktoken>=0.8.0",
    "uvicorn[standard]>=0.54.0",
    "websockets<=13.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008", "S608", "S106", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
