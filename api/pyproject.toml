[project]
name = "amber-api"
version = "0.1.0"
description = "Amber API: FastAPI backend for the Amber enterprise RAG app"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "firebase-admin>=7.7.0",
    "google-auth>=2.59.1",
    "google-cloud-kms>=3.18.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
